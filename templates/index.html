<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SupportHub Help Desk</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

<header class="topbar">
    <div>
        <h1>SupportHub</h1>
        <p>Help Desk Support System</p>
    </div>
    <button id="logoutBtn" class="danger hidden">Logout</button>
</header>

<main class="container">

    <section id="authSection" class="card auth-card">

        <div class="tabs">
            <button id="loginTab" class="active">Login</button>
            <button id="registerTab">Register</button>
        </div>

        <form id="authForm">
            <label for="username">Username</label>
            <input id="username" type="text" required>

            <label for="password">Password</label>
            <input id="password" type="password" required>

            <button type="submit" class="primary" id="authSubmit">
                Login
            </button>
        </form>

        <p id="authMessage"></p>

        <div class="demo-box">
            <strong>Demo Account</strong>
            <p>Username: demo</p>
            <p>Password: demo123</p>
        </div>

    </section>

    <section id="dashboard" class="hidden">

        <div class="welcome">
            <h2>Help Desk Dashboard</h2>
            <p>Welcome, <span id="currentUsername"></span></p>
        </div>

        <div class="stats-grid">

            <div class="stat-card">
                <h3>Total</h3>
                <p id="totalStat">0</p>
            </div>

            <div class="stat-card">
                <h3>Open</h3>
                <p id="openStat">0</p>
            </div>

            <div class="stat-card">
                <h3>In Progress</h3>
                <p id="progressStat">0</p>
            </div>

            <div class="stat-card">
                <h3>Resolved</h3>
                <p id="resolvedStat">0</p>
            </div>

        </div>

        <section class="card">
            <h2>Create Ticket</h2>

            <form id="ticketForm">

                <label for="ticketTitle">Title</label>
                <input id="ticketTitle" type="text" required>

                <label for="ticketDescription">Description</label>
                <textarea id="ticketDescription" required></textarea>

                <label for="category">Category</label>
                <select id="category">
                    <option value="Account">Account</option>
                    <option value="Hardware">Hardware</option>
                    <option value="Software">Software</option>
                    <option value="Network">Network</option>
                    <option value="Other">Other</option>
                </select>

                <label for="priority">Priority</label>
                <select id="priority">
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                </select>

                <button type="submit" class="primary">
                    Create Ticket
                </button>

            </form>

            <p id="ticketMessage"></p>
        </section>

        <section class="card">

            <div class="section-header">
                <h2>Tickets</h2>
                <button id="refreshBtn">Refresh</button>
            </div>

            <div class="filters">

                <select id="statusFilter">
                    <option value="">All Statuses</option>
                    <option value="Open">Open</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Resolved">Resolved</option>
                </select>

                <select id="priorityFilter">
                    <option value="">All Priorities</option>
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                </select>

            </div>

            <div id="ticketList"></div>

        </section>

        <section class="card">

            <h2>Browser Preference</h2>

            <select id="preferenceFilter">
                <option value="all">All Tickets</option>
                <option value="open">Open Tickets</option>
                <option value="resolved">Resolved Tickets</option>
            </select>

            <button id="savePreferenceBtn">
                Save Preference
            </button>

            <p id="preferenceMessage"></p>

        </section>

        <section class="card">

            <h2>Request Inspector</h2>

            <button id="inspectBtn">
                Inspect Request
            </button>

            <pre id="requestInfo"></pre>

        </section>

    </section>

</main>

<script src="{{ url_for('static', filename='app.js') }}"></script>

</body>
</html>
